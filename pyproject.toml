[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-toolkit"
version = "0.5.0"
description = "Inspect, compress, split, dissect, and convert PDFs: multi-library metadata and TOC analysis, structural, pypdf, and Ghostscript compression, chapter splitting by bookmarks/CSV/headings, form-page detection and reconstruction to fillable HTML/PDF/DOCX, DOCX/XLSX to PDF conversion, .docx formatting checks, and flagging DOCX text similar to a PDF source for citation review, with a CLI and an optional PyQt6 GUI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "enonymous1" }]
keywords = ["pdf", "pypdf", "pymupdf", "pdfminer", "pdfplumber", "compression", "metadata", "splitting", "form-extraction", "fillable-pdf", "ocr", "citation-checking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing",
]
dependencies = [
    "PyMuPDF>=1.24.0",
    "pypdf>=4.0.0",
    "pdfminer.six>=20231228",
    "pdfplumber>=0.11.0",
    "rapidfuzz>=3.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.5.0"]
tables = [
    "camelot-py>=0.11.0",
    "tabula-py>=2.0.0",
    "pandas>=2.0.0",
]
ocr = [
    "pytesseract>=0.3.0",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
]
export = [
    "pymupdf4llm>=0.0.10",
    "pdf2docx>=0.5.0",
]
office = [
    "python-docx>=1.0.0",
    "docx2pdf>=0.1.8",
    "openpyxl>=3.1.0",
    "pywin32>=306; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]
dissect = [
    "opencv-python-headless>=4.8.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "reportlab>=3.6.0",
    "Flask>=2.0",
    "python-docx>=1.0.0",
    "docxtpl>=0.17.0",
    "pytesseract>=0.3.0",
]
citations = [
    "python-docx>=1.0.0",
]

[project.scripts]
pdf-toolkit = "pdf_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/enonymous1/pdf-toolkit"
Repository = "https://github.com/enonymous1/pdf-toolkit"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pdf_toolkit*"]

[tool.setuptools.package-data]
"pdf_toolkit.dissect" = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
