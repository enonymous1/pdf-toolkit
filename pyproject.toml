[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-toolkit"
dynamic = ["version"]
description = "Inspect, compress, split, dissect, and convert PDFs: multi-library metadata and TOC analysis, structural, pypdf, and Ghostscript compression, chapter splitting by bookmarks/CSV/headings, form-page detection and reconstruction to fillable HTML/PDF/DOCX, DOCX/XLSX to PDF conversion, .docx formatting checks, and flagging DOCX text similar to a PDF source for citation review, with a CLI and an optional PyQt6 GUI."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "enonymous1" }]
keywords = ["pdf", "pypdf", "pymupdf", "pdfminer", "pdfplumber", "compression", "metadata", "splitting", "form-extraction", "fillable-pdf", "ocr", "citation-checking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing",
]
dependencies = [
    "PyMuPDF>=1.24.0",
    "pypdf>=4.0.0",
    "pdfminer.six>=20231228",
    "pdfplumber>=0.11.0",
    "rapidfuzz>=3.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.5.0"]
web = ["Flask>=2.0"]
tables = [
    "camelot-py>=0.11.0",
    "tabula-py>=2.0.0",
    "pandas>=2.0.0",
]
ocr = [
    "pytesseract>=0.3.0",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
]
export = [
    "pymupdf4llm>=0.0.10",
    "pdf2docx>=0.5.0",
]
office = [
    "python-docx>=1.0.0",
    "docx2pdf>=0.1.8",
    "openpyxl>=3.1.0",
    "pywin32>=306; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "mypy>=1.0",
]
dissect = [
    "opencv-python-headless>=4.8.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "reportlab>=3.6.0",
    "Flask>=2.0",
    "python-docx>=1.0.0",
    "docxtpl>=0.17.0",
    "pytesseract>=0.3.0",
]
citations = [
    "python-docx>=1.0.0",
]

[project.scripts]
pdf-toolkit = "pdf_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/enonymous1/pdf-toolkit"
Repository = "https://github.com/enonymous1/pdf-toolkit"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pdf_toolkit*"]

[tool.setuptools.dynamic]
version = { attr = "pdf_toolkit.__version__" }

[tool.setuptools.package-data]
"pdf_toolkit.dissect" = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
show_error_codes = true

# Note: PyQt6's own QtGui.pyi stubs contain invalid syntax (e.g.
# `def drawConvexPolygon(self, point, *args, /)` — "/" must come
# before "*"), so mypy aborts as soon as it follows an import into
# them. That only happens when PyQt6 is installed alongside Pillow:
# Pillow's Image module imports ImageQt, which imports PyQt6, so the
# chain goes through Pillow, not through our gui package — which is
# why --exclude 'gui' and follow_imports = "skip" both fail to help
# (mypy follows imports regardless of exclude, and still parses the
# stub to resolve the import). The all-extras typecheck job in CI
# therefore omits the gui extra (see ci.yml); the gui files are still
# checked with PyQt6 absent, where Qt names are Any. Do not "fix"
# this by editing site-packages, and do not pin PyQt6 just for its
# stubs.
