name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dissect,citations]"
      - name: Lint
        run: |
          ruff check src tests scripts examples
          ruff format --check src tests scripts examples
      - name: Typecheck
        run: mypy src/pdf_toolkit
      - name: Test
        run: python -m pytest -q

  # The main job installs only dev+dissect+citations, so the other extras
  # were never exercised in CI at all (how the 0.2.0-era "works on my
  # machine" bugs happened). This job installs every extra and only
  # imports each optional module: it catches missing dependencies and
  # import-time errors without needing Java, Word, Excel, or a display,
  # none of which are available on a CI runner.
  extras-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PyQt6's QtGui links against libEGL at *import* time, and
      # ubuntu-latest does not ship it by default. QT_QPA_PLATFORM
      # does not help here: the failure happens while loading the
      # shared library, before any platform plugin is chosen. Without
      # these, importing pdf_toolkit.gui.main_gui fails with
      # "libEGL.so.1: cannot open shared object file" even though no
      # window is ever created.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui,tables,ocr,export,office,dissect,citations]"
      - name: Import every optional module
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import camelot, tabula, pytesseract, pdf2image, pymupdf4llm, pdf2docx, docx, openpyxl, cv2, flask, docxtpl, reportlab, numpy, PIL"
          python -c "from pdf_toolkit.cli import main; from pdf_toolkit.gui.main_gui import PdfDropWindow"

  # The main job's mypy only sees the dissect/citations extras, so
  # optional-import typing errors in other extras (like the 0.6.0
  # ocr_utils failure, which only appeared once OpenCV was installed,
  # and the 0.6.1 ocr_engine failure, which only appeared once
  # pdf2image was installed) would slip through. This job installs
  # every extra EXCEPT gui and typechecks the full package.
  # Why not gui too: PyQt6's QtGui.pyi stubs contain invalid syntax
  # (`*args, /`), and mypy aborts parsing them whenever PyQt6 is
  # installed alongside Pillow — because Pillow's Image module imports
  # ImageQt, which imports PyQt6, so the chain goes through Pillow,
  # not through our gui package. --exclude 'gui' cannot help: mypy
  # follows imports regardless of exclude, and follow_imports =
  # "skip" does not help either (mypy still parses the stub to
  # resolve the import). Omitting the gui extra is the only thing
  # that works: with PyQt6 absent, its stubs are never parsed and
  # the gui files are still checked, with Qt names as Any — the same
  # as in the main job. The gui import itself is smoke-tested in
  # extras-smoke above. Do not re-add a mypy step to extras-smoke
  # or re-add gui here without first reproducing the QtGui.pyi
  # failure in an editable install with Pillow present.
  mypy-all-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install all extras except gui
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tables,ocr,export,office,dissect,citations]"
      - name: Typecheck with all non-gui extras installed
        run: mypy src/pdf_toolkit
