name: Pages demo

# Freeze the web frontend's seeded demo to static HTML and deploy it
# as the GitHub Pages site. The frozen demo is view-only: its forms
# render disabled (see web/app.py freeze_demo), because Pages cannot
# run the Flask server. One-time setup, done by the repo owner:
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install web extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web]"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Freeze demo
        run: python -m pdf_toolkit.cli web --freeze-dir _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # upload-pages-artifact@v3 MUST be deployed with deploy-pages@v4
        # or newer. The v2 deploy action could not find the v3 artifact
        # at all ("Cannot find any run"), which is what the first three
        # deploys failed with — it was not the Pages source setting.
        uses: actions/deploy-pages@v4
